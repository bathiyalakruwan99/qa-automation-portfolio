name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-static-and-unit:
    name: framework - typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-qa-automation-framework
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-qa-automation-framework/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests (framework utilities, state engine, demo app)
        run: npm run test:unit
