name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan full git history
        # --verbose names file, rule and commit for each finding; --redact keeps secret values masked.
        run: ./gitleaks git . --log-opts="--all" --redact --verbose --no-banner --exit-code 1

      - name: Scan working tree
        run: ./gitleaks dir . --redact --verbose --no-banner --exit-code 1

  pattern-check:
    name: repository pattern check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan tracked files for secret patterns
        run: node scripts/check-no-secrets.js --all
