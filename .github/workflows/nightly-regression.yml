name: Nightly Regression

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  playwright-regression:
    name: Playwright regression (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: smart-qa-agent-os/playwright-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-qa-agent-os/playwright-demo/package.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run regression tests
        env:
          CI: 'true'
        run: npx playwright test --project=chromium --grep "@regression|@hybrid|@api"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report
          path: smart-qa-agent-os/playwright-demo/playwright-report
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-failures
          path: smart-qa-agent-os/playwright-demo/test-results
          retention-days: 14

  newman-regression:
    name: Newman API regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman collection
        run: |
          newman run smart-qa-agent-os/postman-newman/demo-api.postman_collection.json \
            -e smart-qa-agent-os/postman-newman/demo-api.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-regression-report
          path: newman-report.html
          retention-days: 14
