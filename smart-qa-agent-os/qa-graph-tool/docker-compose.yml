# Sample docker-compose structure for the QA Graph Tool.
# This is a synthetic template for portfolio demonstration.
# Actual implementation is private.

version: '3.9'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - PROJECT_ROOT=/project
    volumes:
      - ..:/project:ro
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - api
    restart: unless-stopped
